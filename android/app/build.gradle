plugins { id 'com.android.application' }

android {
    namespace 'com.cloudgst.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cloudgst.app'
        minSdk 26
        targetSdk 34
        versionCode 58
        versionName '5.8'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
