plugins { id 'com.android.application' }

android {
    namespace 'com.cloudgst.app'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.cloudgst.app'
        minSdk 24
        targetSdk 34
        versionCode 79
        versionName '5.9.16'
    }

    signingConfigs {
        // repo me hai taaki har build SAME key se sign ho -> naya APK purane ke upar seedha install ho jaye
        // CI/local env overrides supported via ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH') ?: '../keystore.p12'
            storeFile file(ksPath)
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'cloudgst2026'
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'cloudgst'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: 'cloudgst2026'
            storeType 'PKCS12'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

// kotlin 1.8+ me jdk7/jdk8 stdlib ka code stdlib me hi aa gaya hai -> duplicate class error se bachne ke liye
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    // Android 7 (API 24) se hi fingerprint / device-PIN lock
    implementation 'androidx.biometric:biometric:1.1.0'
}
