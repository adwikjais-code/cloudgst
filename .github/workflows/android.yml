name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  RELEASE_TAG: android-v5.9.8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 55000 build.log > tail.log || true
          gh issue create \
            --title "Android build log (auto) $(date -u +%Y-%m-%dT%H:%MZ)" \
            --body-file tail.log || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudgst-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp android/app/build/outputs/apk/release/app-release.apk "CloudGST.apk"
          ls -l "CloudGST.apk"
          {
            echo "### APK verify"
            echo '```'
            sha256sum "CloudGST.apk"
            md5sum "CloudGST.apk"
            unzip -l "CloudGST.apk" | tail -30
            echo "manifest ok: $(unzip -p "CloudGST.apk" AndroidManifest.xml > /dev/null && echo yes)"
            echo "signature files: $(unzip -Z1 "CloudGST.apk" | grep -cE '^META-INF/.*(RSA|SF|MF)$' || true)"
            echo "index.html bytes: $(unzip -p "CloudGST.apk" assets/app/index.html | wc -c)"
            echo "js back handler: $(unzip -p "CloudGST.apk" assets/app/index.html | grep -c cloudGstHandleBack || true)"
            echo "js bio toggle: $(unzip -p "CloudGST.apk" assets/app/index.html | grep -c gpBioLockBtn || true)"
            echo "js header fingerprint btn: $(unzip -p "CloudGST.apk" assets/app/index.html | grep -c gpNativeBioBtn || true)"
            echo "js bioStatus bridge: $(unzip -p "CloudGST.apk" assets/app/index.html | grep -c bioStatus || true)"
            echo "dex bioStatus: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac bioStatus || true)"
            echo "js native unlock hook: $(unzip -p "CloudGST.apk" assets/app/index.html | grep -c cloudGstNativeUnlocked || true)"
            echo "dex native unlock hook: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac cloudGstNativeUnlocked || true)"
            echo "js source switch: $(unzip -p "CloudGST.apk" assets/app/index.html | grep -c gpSrcSwitch || true)"
            echo "js phone fetch: $(unzip -p "CloudGST.apk" assets/app/index.html | grep -c gpPhoneFetch2b || true)"
            echo "dex phone fetch: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac phoneFetch2b || true)"
            echo "dex ui-thread start: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac startPhoneFetch || true)"
            echo "js native portal: $(unzip -p "CloudGST.apk" assets/app/index.html | grep -c gpNativePortalBtn || true)"
            echo "dex openPortal: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac openPortal || true)"
            echo "dex CloudGSTNative: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac CloudGSTNative || true)"
            echo "dex BiometricPrompt: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac BiometricPrompt || true)"
            echo "dex saveBase64: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac saveBase64 || true)"
            echo "dex FileProvider: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac FileProvider || true)"
            echo "launcher icon files: $(unzip -Z1 "CloudGST.apk" | grep -c 'mipmap.*ic_launcher' || true)"
            echo "splash logo: $(unzip -Z1 "CloudGST.apk" | grep -c 'splash_logo' || true)"
            echo '```'
          } > verify.md
          cat verify.md
          cat > notes.md <<'EOF'
          ## CloudGST Android APK (v5.9.8 — phone mode: login pehle (captcha/OTP), page diagnostics, render fix)

          Install kaise karein:
          1. Neeche **CloudGST.apk** download karein.
          2. Phone me kholein — "Unknown sources / Install anyway" allow karein.
          3. Icon **J&A (CloudGST)** kholein. Pehle se install hai to seedha update ho jayega
             (data/settings safe rahenge).

          Naya kya hai:
          - **🔒 Fingerprint / Touch ID lock** — Settings me App lock ON/OFF. Ab Android 7 (Nougat)
            se hi chalta hai; fingerprint na ho to phone ka PIN/pattern bhi chalega.
          - **Swipe se back** — pehle khula popup band, phir pichhla tab, phir app se bahar (Android 13+ predictive back).
          - **Logo** — PDF letterhead wala hi navy + gold "J&A" monogram: launcher icon aur app khulte
            waqt ka splash screen, aur lock screen par bhi.
          - **Downloads** — app ke JSON / PDF / CSV file seedha phone ke **Downloads** folder me
            (notification me progress), pehle jaisa "kuch nahi hua" nahi.
          - **Share** — native share sheet se WhatsApp/Gmail me file bhejein.
          - **🌐 Portal Login** — portal tab me client ke saamne button; app ke andar GST portal khulta hai
            ID/password pehle se bhare hue, sirf captcha aapko dalna hai.
          - App UI bilkul **v5_8 jaisa** (koi naya button/flow nahi).
          EOF
          cat verify.md >> notes.md
          gh release delete "$RELEASE_TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$RELEASE_TAG" 2>/dev/null || true
          gh release create "$RELEASE_TAG" "CloudGST.apk" \
            --title "CloudGST Android v5.9.8 (APK)" \
            --notes-file notes.md
