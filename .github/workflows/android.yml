name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 55000 build.log > tail.log || true
          gh issue create \
            --title "Android build log (auto) $(date -u +%Y-%m-%dT%H:%MZ)" \
            --body-file tail.log || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudgst-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp android/app/build/outputs/apk/debug/app-debug.apk "CloudGST-v5.8.apk"
          ls -l "CloudGST-v5.8.apk"
          cat > notes.md <<'EOF'
          ## CloudGST Android APK (v5.8)

          Install kaise karein:
          1. Neeche **CloudGST-v5.8.apk** download karein.
          2. Phone me kholein — "Unknown sources / Install anyway" allow karein.
          3. Icon **CloudGST** kholein; Settings me Apps Script URL ek baar daalein (baaki sab pehle jaisa).

          Naya: har ready client ke aage **🌐 Portal Login** button — app ke andar GST portal khulta hai,
          ID/password pehle se bhare hue, aapko **sirf captcha** dalna hai (login aap khud dabate hain).
          EOF
          gh release delete android-v5.8 --yes 2>/dev/null || true
          git push origin :refs/tags/android-v5.8 2>/dev/null || true
          gh release create android-v5.8 "CloudGST-v5.8.apk" \
            --title "CloudGST Android v5.8 (APK)" \
            --notes-file notes.md
