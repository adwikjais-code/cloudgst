name: Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "web/**"
      - "scripts/**"
      - "APPS_SCRIPT_AppSync.gs"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: android-v6.2.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Build web assets & run tests
        run: |
          npm ci --ignore-scripts
          npm run build:web
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudgst-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to Release
        if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp android/app/build/outputs/apk/release/app-release.apk "CloudGST.apk"
          ls -l "CloudGST.apk"
          {
            echo "### APK verify"
            echo '```'
            sha256sum "CloudGST.apk"
            md5sum "CloudGST.apk"
            unzip -l "CloudGST.apk" | tail -35
            echo "manifest ok: $(unzip -p "CloudGST.apk" AndroidManifest.xml > /dev/null && echo yes)"
            echo "signature files: $(unzip -Z1 "CloudGST.apk" | grep -cE '^META-INF/.*(RSA|SF|MF)$' || true)"
            echo "index.html bytes: $(unzip -p "CloudGST.apk" assets/app/index.html | wc -c)"
            echo "vendor tailwind css bytes: $(unzip -p "CloudGST.apk" assets/app/vendor/tailwind.min.css | wc -c)"
            echo "vendor pdf.js bytes: $(unzip -p "CloudGST.apk" assets/app/vendor/pdf.min.js | wc -c)"
            echo "js modules count: $(unzip -Z1 "CloudGST.apk" | grep -c '^assets/app/js/.*\.js$' || true)"
            echo "js back handler: $(unzip -p "CloudGST.apk" assets/app/index.html 'assets/app/js/*.js' | grep -c cloudGstHandleBack || true)"
            echo "js bio toggle: $(unzip -p "CloudGST.apk" assets/app/index.html 'assets/app/js/*.js' | grep -c gpBioLockBtn || true)"
            echo "js header fingerprint btn: $(unzip -p "CloudGST.apk" assets/app/index.html 'assets/app/js/*.js' | grep -c gpNativeBioBtn || true)"
            echo "js bioStatus bridge: $(unzip -p "CloudGST.apk" assets/app/index.html 'assets/app/js/*.js' | grep -c bioStatus || true)"
            echo "dex bioStatus: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac bioStatus || true)"
            echo "js native unlock hook: $(unzip -p "CloudGST.apk" assets/app/index.html 'assets/app/js/*.js' | grep -c cloudGstNativeUnlocked || true)"
            echo "dex native unlock hook: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac cloudGstNativeUnlocked || true)"
            echo "js source switch: $(unzip -p "CloudGST.apk" assets/app/index.html 'assets/app/js/*.js' | grep -c gpSrcSwitch || true)"
            echo "js phone fetch: $(unzip -p "CloudGST.apk" assets/app/index.html 'assets/app/js/*.js' | grep -c gpPhoneFetch2b || true)"
            echo "dex phone fetch: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac phoneFetch2b || true)"
            echo "dex ui-thread start: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac startPhoneFetch || true)"
            echo "dex phone login: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac phoneLoginStart || true)"
            echo "dex phone poll: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac phonePayloadFor || true)"
            echo "dex inapp login overlay: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac phoneLoginVisible || true)"
            echo "js phone poll: $(unzip -p "CloudGST.apk" assets/app/index.html 'assets/app/js/*.js' | grep -c gpNativePoll || true)"
            echo "js native portal: $(unzip -p "CloudGST.apk" assets/app/index.html 'assets/app/js/*.js' | grep -c gpNativePortalBtn || true)"
            echo "dex openPortal: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac openPortal || true)"
            echo "dex CloudGSTNative: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac CloudGSTNative || true)"
            echo "dex BiometricPrompt: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac BiometricPrompt || true)"
            echo "dex saveBase64: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac saveBase64 || true)"
            echo "dex FileProvider: $(unzip -p "CloudGST.apk" 'classes*.dex' | grep -ac FileProvider || true)"
            echo "launcher icon files: $(unzip -Z1 "CloudGST.apk" | grep -c 'mipmap.*ic_launcher' || true)"
            echo "splash logo: $(unzip -Z1 "CloudGST.apk" | grep -c 'splash_logo' || true)"
            echo '```'
          } > verify.md
          cat verify.md
          cat > notes.md <<'EOF'
          ## CloudGST Android APK (v6.2.1)

          Install kaise karein:
          1. Neeche **CloudGST.apk** download karein.
          2. Phone me kholein — "Unknown sources / Install anyway" allow karein.
          3. Icon **J&A (CloudGST)** kholein. Pehle se install hai to seedha update ho jayega
             (data/settings safe rahenge).

          Naya kya hai (v6.2.1):
          - 📤 **Android Share Sheet (WhatsApp / Files / Gallery → CloudGST)** me ab **3 direct options**:
            1. **📎 Client Document me Save** — shared file(s) seedha us client ke **Drive > Documents** folder me upload hongi.
            2. **📊 Etsy CSV (Master + Doc)** — Etsy CSV ka month-wise data **Master Etsy Sheet** me jayega **aur** file bhi client ke **Drive > Documents** folder me save hogi.
            3. **🆕 Naya Client Add Karein (GST Paper + Doc Save)** — Naye client ka **GST Certificate PDF / Paper** share karte hi details (GSTIN, Legal Name, Firm Name, Reg Date, Address) auto-fill hokar Add Client form khulega; Save karte hi naya client Sheet me add hoga **aur** GST paper bhi uske **Drive > Documents** folder me save ho jayega!
          - Phone Mode GSTR-1 Upload, APK Mobile-Only UI, External Keyboard Soft-IME suppression, Spacebar shortcut, aur 5-Tab Parallel Fetch sab intact.
          EOF
          (cd android/app/src/main/assets && zip -r9 "$GITHUB_WORKSPACE/CloudGST_web_v6_2_1.zip" app)
          ls -lh "CloudGST_web_v6_2_1.zip"
          cat verify.md >> notes.md
          gh release delete "$RELEASE_TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$RELEASE_TAG" 2>/dev/null || true
          gh release create "$RELEASE_TAG" "CloudGST.apk" "CloudGST_web_v6_2_1.zip" \
            --target "$GITHUB_SHA" \
            --title "CloudGST Android v6.2.1 (APK + Web Bundle)" \
            --notes-file notes.md
