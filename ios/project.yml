name: CloudGST
options:
  bundleIdPrefix: com.cloudgst
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_BITCODE: NO

targets:
  CloudGST:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: CloudGST
        excludes:
          - "Info.plist"
          - "app/**"
          - "Assets.xcassets/**"
      - path: CloudGST/app
        type: folder
        buildPhase: resources
      - path: CloudGST/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: CloudGST/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudgst.app
        PRODUCT_NAME: CloudGST
        MARKETING_VERSION: "6.2.1"
        CURRENT_PROJECT_VERSION: "88"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - sdk: WebKit.framework
      - sdk: Network.framework
      - sdk: LocalAuthentication.framework
      - sdk: UniformTypeIdentifiers.framework
